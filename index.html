<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首页 - PLAYThe218's Blog</title>
    <style>

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
        }   

        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        main {
            margin: 0px;
            height: 100%;
            background-color: rgba(180, 180, 180, 0.32);
            border-radius: 24px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            box-sizing: border-box;
            padding: 20px;
            align-items: center;
        }

        .fullwidth {
            padding: 10px;
            height: 100%;
            box-sizing: border-box;
        }
        
        .introSide {
            width: 360px;
            height: 100vh;
            background-color: rgb(224, 224, 224);
        }

        .mainSide {
            width: calc(100vw - 360px);
            background-color: rgb(238, 238, 238);
        }

        .profile {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 {
            color: #000000;
        }

        p {
            color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="introSide">
            <div class="fullwidth">
                <main>
                    <div class="profile">
                        <img src="share/playthe218.png" alt="PLAYThe218's Profile Picture">
                    </div>
                    <h1>PLAYThe218</h1>
                </main>
        </div>
        <div class="mainSide">
        </div>
    </div>
</body>
</html>
